<section class="hero">
  <h1>Live Capture</h1>
  <p>Start real-time sand image capturing using your connected camera device.</p>
  <div class="btn-group">
    <button id="startCameraBtn" class="btn primary-btn"><i class="fas fa-camera"></i> Start Camera</button>
    <button id="uploadSampleBtn" class="btn secondary-btn"><i class="fas fa-upload"></i> Upload Sample</button>
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
  </div>
</section>

<section class="main-container container">
  <div class="feature-grid">
    <div class="feature-card">
      <h3>Camera Setup</h3>
      <p>Configure your camera settings for optimal sand grain imaging.</p>
    </div>
    <div class="feature-card">
      <h3>Real-time Feed</h3>
      <p>View live camera feed and capture images on demand.</p>
    </div>
  </div>
</section>

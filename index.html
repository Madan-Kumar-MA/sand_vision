<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SandVision - Beach Sand Grain Mapping System</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>
  <header>
    <div class="container header-flex">
      <div class="logo">
        <div class="logo-icon">S</div>
        <span>SandVision</span>
      </div>
      <button id="menuToggle" class="menu-toggle" style="display:none;background:none;border:none;color:var(--white);cursor:pointer;font-size:1.5rem;padding:0;">
        <i class="fas fa-bars"></i>
      </button>
      <nav id="navMenu">
        <a href="#" class="active" data-page="home.html"><i class="fas fa-home"></i> Home</a>
        <a href="#" data-page="live-capture.html"><i class="fas fa-video"></i> Live Capture</a>
        <a href="#" data-page="analysis.html"><i class="fas fa-chart-bar"></i> Analysis</a>
        <a href="#" data-page="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="#" data-page="download.html"><i class="fas fa-download"></i> Download</a>
        <button id="themeToggle" style="background:none;border:none;color:var(--white);cursor:pointer;font-size:1.2rem;margin-left:20px;padding:0;transition:transform 0.3s;" title="Toggle dark/light theme">
          <i class="fas fa-moon"></i>
        </button>
      </nav>
    </div>
  </header>

  <!-- Page content loads here -->
  <main id="content-area"></main>

  <!-- Camera Modal -->
  <div class="camera-modal" id="cameraModal">
    <div class="camera-container">
      <div class="camera-header">
        <h2>Camera Capture</h2>
        <button class="close-btn" id="closeCamera">&times;</button>
      </div>
      <video id="cameraFeed" autoplay playsinline></video>
      <canvas id="canvasCapture" style="display: none;"></canvas>
      <img id="capturePreview" class="preview-image" style="display: none;">
      <div class="image-info" id="imageInfo"></div>
      <div class="camera-controls">
        <button class="btn capture-btn" id="captureBtn">Capture Photo</button>
        <button class="btn cancel-btn" id="stopCameraBtn">Close</button>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2025 SandVision | RNS Institute of Technology</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- cache-bust script to ensure latest behavior is loaded -->
  <script src="script.js?v=4"></script>
</body>
</html>
